name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-branch
  cancel-in-progress: true
jobs:
  # Legacy "Deploy from branch" builds are stuck/errored for this repo.
  # Keep a clean gh-pages branch so Pages can be pointed at it.
  publish-gh-pages-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare publish folder
        run: |
          mkdir -p _site
          cp index.html _site/
          printf '\n' > _site/.nojekyll
          cp README.md _site/ 2>/dev/null || true
      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          commit_message: Deploy from main ${{ github.sha }}
